# Trae las novedades del template a tu copia abriendo un Pull Request.
# Tú decides cuándo aplicarlas: al hacer "Merge" Vercel despliega (y aplica las migraciones).
name: Sincronizar con el template

on:
  schedule:
    - cron: "0 7 * * 1" # cada lunes
  workflow_dispatch: # también a mano desde la pestaña Actions

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM: https://github.com/JavierStark/crm-iaeste.git
  BRANCH: template-sync

jobs:
  sync:
    # No se ejecuta en el propio template
    if: github.repository != 'JavierStark/crm-iaeste'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Opcional: un token personal (secret SYNC_TOKEN) es necesario si el template
          # modifica ficheros de .github/workflows, que el token por defecto no puede subir.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Traer upstream y comprobar si hay novedades
        id: check
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "Ya estás al día."
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Intentar el merge
        id: merge
        if: steps.check.outputs.pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          if git merge upstream/main --no-edit -m "Actualizar desde el template"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir o actualizar el Pull Request
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          git push --force origin "$BRANCH"
          body="Novedades del template (ver CHANGELOG.md). Al hacer Merge, Vercel despliega y aplica las migraciones nuevas."
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "Actualizar desde el template" --body "$body"
          fi

      - name: Avisar si hay conflictos
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="El template tiene novedades con conflictos"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" \
              --body "Has modificado ficheros que el template también cambió, así que no se puede actualizar solo. Sigue los pasos de UPDATING.md para resolver los conflictos a mano."
          fi
